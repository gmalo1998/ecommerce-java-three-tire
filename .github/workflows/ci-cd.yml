name: Ecommerce CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-and-scan:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Ecomm-react-tsx-frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Ecomm-springboot-backend/pom.xml

      - name: Install Frontend Dependencies
        working-directory: Ecomm-react-tsx-frontend
        run: npm ci

      # ========================================================
      # 1. FRONTEND STRICT SCAN & HTML REPORT
      # ========================================================
      - name: Frontend Vulnerability Scan (Generate HTML)
        working-directory: Ecomm-react-tsx-frontend
        run: |
          # HTML bananor tool install kora
          npm install -g npm-audit-html
          
          # JSON data ber kora (|| true dewa ache jate ekhane script na bhenge jay)
          npm audit --json > audit.json || true
          
          # JSON theke HTML Table toiri kora (Jekhane ID, Name abong Critical count thakbe)
          npm-audit-html --input audit.json --output frontend-security-report.html
          
          # STRICT CHECK: Ebar asol audit run korbe. High ba Critical thaklei pipeline strict fail korbe!
          npm audit --audit-level=high

      - name: Upload Frontend HTML Report
        if: always() # STRICT scan fail korleo ai HTML report obosshoi upload hobe
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit-report
          path: Ecomm-react-tsx-frontend/frontend-security-report.html

      # ========================================================
      # 2. BACKEND BUILD & STRICT SCAN (OWASP)
      # ========================================================
      - name: Backend Build & Tests
        if: always() # Frontend fail korleo Backend er kaaj chalabe
        working-directory: Ecomm-springboot-backend
        run: mvn -B clean verify

      - name: Backend OWASP Scan (Generate HTML)
        if: always() # Test fail korleo OWASP obosshoi run korbe
        working-directory: Ecomm-springboot-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # STRICT CHECK: failBuildOnCVSS=7 er mane holo High/Critical pelei pipeline fail korbe!
          # OWASP nije thekei 'dependency-check-report.html' name ekta report toiri korbe.
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey="$NVD_API_KEY"

      - name: Upload Backend HTML Report
        if: always() # OWASP strict fail korleo tar HTML report obosshoi upload hobe
        uses: actions/upload-artifact@v4
        with:
          name: backend-owasp-report
          path: Ecomm-springboot-backend/target/dependency-check-report.html

      # ========================================================
      # 3. CODE QUALITY (SONARCLOUD)
      # ========================================================
      - name: SonarCloud Code Quality Analysis
        if: always() # Security scan fail korleo code quality check hobe
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ecommerce-java-three-tire
            -Dsonar.organization=gmalo1998
            -Dsonar.sources=Ecomm-react-tsx-frontend,Ecomm-springboot-backend/src/main/java
            -Dsonar.java.binaries=Ecomm-springboot-backend/target/classes

