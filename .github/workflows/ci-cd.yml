
name: Ecommerce CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GITHUB_TAGS: ${{ github.sha }}
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPO: ecomm-three-tier-frontend
  BACKEND_REPO: ecomm-three-tier-backend

permissions:
  contents: write

concurrency:
  group: ecommerce-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build-test-and-scan:
    name: Build, Test, Security Scan & Deploy
    runs-on: [self-hosted, aws-prod]

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      # ========================================================
      # 2. SETUP NODE.JS
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Ecomm-react-tsx-frontend/package-lock.json

      # ========================================================
      # 3. SETUP JAVA
      # ========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Ecomm-springboot-backend/pom.xml

      # ========================================================
      # 4. FRONTEND INSTALL, BUILD AND TEST
      # ========================================================

      - name: Frontend Install Dependencies
        working-directory: Ecomm-react-tsx-frontend
        run: npm ci --ignore-scripts

      - name: Frontend Build
        working-directory: Ecomm-react-tsx-frontend
        run: npm run build

      - name: Frontend Tests
        working-directory: Ecomm-react-tsx-frontend
        run: npm run test -- --run

      # ========================================================
      # 5. FRONTEND SECURITY AUDIT
      # ========================================================

      - name: Frontend Vulnerability Scan
        working-directory: Ecomm-react-tsx-frontend
        run: |
          npm audit --json > audit.json || true

          npx --ignore-scripts npm-audit-html \
            --input audit.json \
            --output frontend-security-report.html

          npm audit --audit-level=high

      - name: Upload Frontend Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit-report
          path: Ecomm-react-tsx-frontend/frontend-security-report.html
          if-no-files-found: ignore

      # ========================================================
      # 6. BACKEND BUILD AND TEST
      # ========================================================

      - name: Backend Build & Tests
        working-directory: Ecomm-springboot-backend
        run: mvn -B clean verify

      # ========================================================
      # 7. OWASP DEPENDENCY CHECK
      # ========================================================

      - name: Backend OWASP Dependency Check
        working-directory: Ecomm-springboot-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -Dnvd.api.key="$NVD_API_KEY"

      - name: Upload Backend OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-owasp-report
          path: Ecomm-springboot-backend/target/dependency-check-report.html
          if-no-files-found: ignore

      # ========================================================
      # 8. SONARCLOUD CODE QUALITY
      # ========================================================

      # - name: SonarCloud Analysis
      #   uses: SonarSource/sonarcloud-github-action@v3.11.1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   with:
      #     args: >
      #       -Dsonar.projectKey=ecommerce-java-three-tire
      #       -Dsonar.organization=gmalo1998
      #       -Dsonar.sources=Ecomm-react-tsx-frontend,Ecomm-springboot-backend/src/main/java
      #       -Dsonar.java.binaries=Ecomm-springboot-backend/target/classes

      # ========================================================
      # 9. DOCKER BUILD
      # ========================================================

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t frontend_image-${GITHUB_TAGS} \
            ./Ecomm-react-tsx-frontend

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t backend_image-${GITHUB_TAGS} \
            ./Ecomm-springboot-backend

      # ========================================================
      # 10. TRIVY SECURITY SCAN
      # ========================================================

      - name: Frontend Trivy Scan
        run: |
          trivy image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            frontend_image-${GITHUB_TAGS}

      - name: Backend Trivy Scan
        run: |
          trivy image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            backend_image-${GITHUB_TAGS}

      # ========================================================
      # 11. AWS ECR LOGIN
      # ========================================================

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws sts get-caller-identity

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      # ========================================================
      # 12. PUSH DOCKER IMAGES TO ECR
      # ========================================================

      - name: Tag and Push Images to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag frontend_image-${GITHUB_TAGS} \
            "$ECR_REGISTRY/$FRONTEND_REPO:$GITHUB_TAGS"

          docker tag backend_image-${GITHUB_TAGS} \
            "$ECR_REGISTRY/$BACKEND_REPO:$GITHUB_TAGS"

          docker push "$ECR_REGISTRY/$FRONTEND_REPO:$GITHUB_TAGS"

          docker push "$ECR_REGISTRY/$BACKEND_REPO:$GITHUB_TAGS"

      # ========================================================
      # 13. GITOPS - UPDATE HELM VALUES
      # ========================================================

      - name: Install PyYAML
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 -m pip install --user PyYAML

      - name: Update Helm Image Tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import yaml
          import os

          path = "helm-charts/ecommerce-app/values.yaml"

          with open(path, "r") as f:
              values = yaml.safe_load(f)

          tag = os.environ["GITHUB_TAGS"]

          values["frontend"]["image"]["tag"] = tag
          values["backend"]["image"]["tag"] = tag

          with open(path, "w") as f:
              yaml.safe_dump(values, f, sort_keys=False)

          print(f"Frontend image tag: {tag}")
          print(f"Backend image tag: {tag}")
          PY

      # ========================================================
      # 14. COMMIT AND PUSH GITOPS CHANGES
      # ========================================================

      - name: Commit and Push Helm Changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          echo "Checking Git status..."
          git status --short

          git add helm-charts/ecommerce-app/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm changes to commit."
            exit 0
          fi

          echo "Creating GitOps commit..."

          git commit \
            -m "chore(deploy): Update image tags for commit ${GITHUB_TAGS} [skip ci]"

          echo "Stashing remaining workspace changes..."

          git stash push --include-untracked \
            -m "CI temporary workspace changes"

          echo "Fetching latest main..."

          git fetch origin main

          echo "Rebasing latest main..."

          git rebase origin/main

          echo "Pushing GitOps changes..."

          git push origin HEAD:main

          echo "GitOps update completed successfully."
