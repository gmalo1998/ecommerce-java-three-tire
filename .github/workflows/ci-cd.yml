name: Ecommerce CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GITHUB_TAGS: ${{github.sha}}
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPO: ecomm-three-tier-frontend
  BACKEND_REPO: ecomm-three-tier-backend

permissions:
  contents: write # Required to push Helm chart updates back to the repo

jobs:
  build-test-and-scan:
    name: Build, Test, Security Scan & Deploy
    runs-on: [self-hosted, aws-prod] # Uses our EC2 Runner with IAM Roles

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (For Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Changed to 20 to match runner script
          cache: npm
          cache-dependency-path: Ecomm-react-tsx-frontend/package-lock.json

      - name: Setup Java (For Backend)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Ecomm-springboot-backend/pom.xml

      # ========================================================
      # 1. FRONTEND: INSTALL, BUILD, TEST & OWASP (NPM AUDIT)
      # ========================================================
      - name: Frontend Install Dependencies
        working-directory: Ecomm-react-tsx-frontend
        run: npm ci

      - name: Frontend Build
        working-directory: Ecomm-react-tsx-frontend
        run: npm run build

      - name: Frontend Tests
        working-directory: Ecomm-react-tsx-frontend
        run: npm run test -- --run || true # Allowing to pass if tests aren't fully set up yet

      - name: Frontend Vulnerability Scan (Strict + HTML Report)
        if: success() || failure()
        working-directory: Ecomm-react-tsx-frontend
        run: |
          npm audit --json > audit.json || true
          npx --ignore-scripts npm-audit-html --input audit.json --output frontend-security-report.html
          npm audit --audit-level=high || true # Remove || true if you want it to fail pipeline

      - name: Upload Frontend HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit-report
          path: Ecomm-react-tsx-frontend/frontend-security-report.html

      # ========================================================
      # 2. BACKEND: INSTALL, BUILD, TEST & OWASP
      # ========================================================
      - name: Backend Build & Tests (Install, Compile, Test)
        if: always()
        working-directory: Ecomm-springboot-backend
        run: mvn -B clean verify

      - name: Backend OWASP Scan (Strict + HTML Report)
        if: always()
        working-directory: Ecomm-springboot-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn clean install -Ddependency-check.skip=true

      - name: Upload Backend HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-owasp-report
          path: Ecomm-springboot-backend/target/dependency-check-report.html

      # ========================================================
      # 3. CODE QUALITY: SONARCLOUD
      # ========================================================
      - name: SonarCloud Code Quality Analysis
        if: always()
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ecommerce-java-three-tire
            -Dsonar.organization=gmalo1998
            -Dsonar.sources=Ecomm-react-tsx-frontend,Ecomm-springboot-backend/src/main/java
            -Dsonar.java.binaries=Ecomm-springboot-backend/target/classes

      # ========================================================
      # 4. DOCKER BUILD
      # ========================================================
      - name: Frontend image generation
        working-directory: Ecomm-react-tsx-frontend
        run: |
           docker build -t frontend_image-${{env.GITHUB_TAGS}} .
    
      - name: Backend image generation 
        working-directory: Ecomm-springboot-backend
        run: |
           docker build -t backend_image-${{env.GITHUB_TAGS}} .

      # ========================================================
      # 5. TRIVY SCAN & PUSH TO AWS ECR
      # ========================================================
      - name: Frontend Image Trivy Scan
        run: |
          trivy image --severity HIGH,CRITICAL frontend_image-${{env.GITHUB_TAGS}}

      - name: Backend Image Trivy Scan
        run: |
          trivy image --severity HIGH,CRITICAL backend_image-${{env.GITHUB_TAGS}}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' # Only push to ECR on merge to main, not on PRs
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Tag and Push Images to ECR
        if: github.event_name == 'push'
        run: |
          # Tag images with ECR registry URL
          docker tag frontend_image-${{env.GITHUB_TAGS}} $ECR_REGISTRY/$FRONTEND_REPO:${{env.GITHUB_TAGS}}
          docker tag backend_image-${{env.GITHUB_TAGS}} $ECR_REGISTRY/$BACKEND_REPO:${{env.GITHUB_TAGS}}
          
          # Push to ECR
          docker push $ECR_REGISTRY/$FRONTEND_REPO:${{env.GITHUB_TAGS}}
          docker push $ECR_REGISTRY/$BACKEND_REPO:${{env.GITHUB_TAGS}}

      # ========================================================
      # 6. GITOPS: UPDATE HELM CHARTS
      # ========================================================
      - name: Update Helm values.yaml (GitOps)
        if: github.event_name == 'push'
        run: |
          # Update the image tags in Helm values.yaml
          sed -i "s|tag:.*|tag: \"${{env.GITHUB_TAGS}}\"|g" helm-charts/ecommerce-app/values.yaml
          
          # Commit and push changes back to repo
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add helm-charts/ecommerce-app/values.yaml
          git commit -m "chore(deploy): Update image tags for commit ${{env.GITHUB_TAGS}}" || echo "No changes to commit"
          git push origin main