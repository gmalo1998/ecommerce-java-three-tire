name: Ecommerce CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-and-scan:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js for React frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Ecomm-react-tsx-frontend/package-lock.json

      # 3. Setup Java for Spring Boot backend
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Ecomm-springboot-backend/pom.xml

      # 4. Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: Ecomm-react-tsx-frontend
        run: npm ci

      # 5. Scan frontend dependencies for vulnerabilities
      - name: Frontend Vulnerability Scan
        working-directory: Ecomm-react-tsx-frontend
        run: npm audit --audit-level=high

      # 6. Run frontend tests
      - name: Frontend Tests
        working-directory: Ecomm-react-tsx-frontend
        run: npm run test -- --run

      # 7. Build and test Spring Boot backend
      - name: Backend Build and Tests
        working-directory: Ecomm-springboot-backend
        run: mvn -B clean verify

      # 8. Scan backend dependencies using OWASP Dependency-Check
      - name: OWASP Backend Dependency Scan
        working-directory: Ecomm-springboot-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey="$NVD_API_KEY"

      # 9. Upload OWASP report even if a previous step failed
      - name: Upload OWASP Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-backend-dependency-report
          path: |
            Ecomm-springboot-backend/target/dependency-check-report.html
            Ecomm-springboot-backend/target/dependency-check-report.json
          if-no-files-found: warn

      # 10. Analyze code quality using SonarCloud
      - name: SonarCloud Code Quality Analysis
        if: success() || failure() # Ensures report is generated even if OWASP or Tests fail
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ecommerce-java-three-tire
            -Dsonar.organization=gmalo1998
            -Dsonar.sources=Ecomm-react-tsx-frontend,Ecomm-springboot-backend/src/main/java
            -Dsonar.java.binaries=Ecomm-springboot-backend/target/classesname: Ecommerce workflow

