name: Ecommarce workflow

on:
  push:
     branches:
       - main

permissions:
  contents: read
jobs: 
  # ==========================
  # JOB 1: Test & Scan Code
  # ==========================
  code-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube er full report er jonno dorkar

      - name: Setup Node (For Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java (For Backend)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Debug repository paths
        run: |
          echo "Repository root:"
          pwd
          echo "Root directory contents:"
          ls -la
          echo "Frontend and backend folders:"
          ls -ld Ecomm-react-tsx-frontend Ecomm-springboot-backend
          echo "Find package.json and pom.xml:"
          find . -maxdepth 4 \( -name package.json -o -name pom.xml \) -not -path "*/node_modules/*"
      - name: Frontend Checks (Install & Test)
        working-directory: ./Ecomm-react-tsx-frontend
        run: |
          npm ci
          npm audit || true
          npm run test -- --run

      - name: Backend Checks (Install & Tests)
        working-directory: ./Ecomm-springboot-backend
        run: |
          mvn -B clean verify

     