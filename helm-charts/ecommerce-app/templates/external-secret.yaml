apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ecomm-db-secret-external
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h" # প্রতি ১ ঘণ্টা পরপর AWS থেকে লেটেস্ট সিক্রেট সিঙ্ক করবে
  secretStoreRef:
    name: aws-secretsmanager-store # ক্লাস্টারের SecretStore-এর নাম
    kind: SecretStore
  target:
    name: ecomm-db-secret # Kubernetes-এ এই নামে সিক্রেট তৈরি হবে যা পড রিড করবে
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: ecommerce/db-credentials
        property: SPRING_DATASOURCE_URL
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: ecommerce/db-credentials
        property: SPRING_DATASOURCE_USERNAME
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: ecommerce/db-credentials
        property: SPRING_DATASOURCE_PASSWORD
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: ecommerce/db-credentials
        property: JWT_SECRET_KEY
    - secretKey: SPRING_MAIL_HOST
      remoteRef:
        key: ecommerce/db-credentials
        property: SPRING_MAIL_HOST
    - secretKey: SPRING_MAIL_PORT
      remoteRef:
        key: ecommerce/db-credentials
        property: SPRING_MAIL_PORT
    - secretKey: SPRING_MAIL_USERNAME
      remoteRef:
        key: ecommerce/db-credentials
        property: SPRING_MAIL_USERNAME
    - secretKey: SPRING_MAIL_PASSWORD
      remoteRef:
        key: ecommerce/db-credentials
        property: SPRING_MAIL_PASSWORD
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: ecommerce/db-credentials
        property: STRIPE_API_KEY
    - secretKey: RAZORPAY_API_KEY
      remoteRef:
        key: ecommerce/razorpay-keys
        property: RAZORPAY_API_KEY
    - secretKey: RAZORPAY_API_SECRET
      remoteRef:
        key: ecommerce/razorpay-keys
        property: RAZORPAY_API_SECRET