apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app.kubernetes.io/name: backend
spec:
  # Internal communication-er jonno ClusterIP babohar kora hoy
  type: ClusterIP 
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http