apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: "{{ .Values.aws.region }}"
      auth:
        jwt:
          serviceAccountRef:
            name: ecomm-sa