apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
  namespace: ecommerce-apps
spec:
provider:
  aws:
    service: SecretsManager
    region: ap-south-1  # তোমার AWS রিজিয়ন এখানে দাও (যেমন ap-south-1)
    auth:
      # আমরা যেহেতু IRSA (IAM Roles for Service Accounts) ব্যবহার করছি, তাই এটি অটোমেটিক রোল পিক করবে
      jwt:
        serviceAccountRef:
          name: default