# helm-charts/ecommerce-app/values.yaml
global:
  environment: prod

aws:
  region: ap-south-1
  iamRoleArn: "arn:aws:iam::975324005004:role/ecomm-prod-eks-external-secrets-role" # তোমার সঠিক IAM Role ARN এখানে বসানো আছে

frontend:
  replicaCount: 2
  image:
    repository: 975324005004.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-frontend
    tag: "6390f83c07e22f3499a15e6ce6239879f44fcefa"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

backend:
  replicaCount: 2
  image:
    repository: 975324005004.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-backend
    tag: "6390f83c07e22f3499a15e6ce6239879f44fcefa"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  env:
    SPRING_PROFILES_ACTIVE: "prod"